     <\u002Fdiv>\n\n            <div style=\"padding:0 28px\">\n              <div style=\"font:700 9.5px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:18px 0 10px\">Caption<\u002Fdiv>\n              <div style=\"{{ modal.capReadStyle }}\">{{ modal.caption }}<\u002Fdiv>\n              <textarea value=\"{{ modal.capValue }}\" sc-camel-on-change=\"{{ modal.setCap }}\" rows=\"3\" placeholder=\"Write the caption…\" style=\"{{ modal.capStyle }}\"><\u002Ftextarea>\n              <a href=\"#\" sc-camel-on-click=\"{{ modal.saveCap }}\" style=\"{{ modal.capSaveStyle }}\" style-hover=\"background:var(--maroon-deep);color:var(--ivory)\">Save caption<\u002Fa>\n\n              <div style=\"font:700 9.5px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:18px 0 10px\">Asset<\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid var(--beige);border-radius:12px;padding:16px 18px\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px\">\n                  <sc-for list=\"{{ modal.assets }}\" as=\"a\">\n                    <div draggable=\"true\" sc-camel-on-drag-start=\"{{ a.onDragStart }}\" sc-camel-on-drag-over=\"{{ a.onDragOver }}\" sc-camel-on-drop=\"{{ a.onDrop }}\" sc-camel-on-drag-end=\"{{ a.onDragEnd }}\" title=\"{{ a.label }}\" style=\"{{ a.tileStyle }}\">\n                      <div style=\"{{ a.mediaStyle }}\">{{ a.fileLabel }}<\u002Fdiv>\n                      <span style=\"{{ a.badgeStyle }}\">{{ a.badge }}<\u002Fspan>\n                      <a href=\"{{ a.url }}\" target=\"_blank\" rel=\"noopener\" style=\"{{ a.openStyle }}\">Open ↗<\u002Fa>\n                      <a href=\"#\" sc-camel-on-click=\"{{ a.remove }}\" style=\"{{ a.removeStyle }}\">×<\u002Fa>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"{{ modal.coverNote }}\">Drag to reorder — the first tile is the carousel cover.<\u002Fdiv>\n                <span style=\"{{ modal.noAssetStyle }}\">No asset attached yet — upload one below.<\u002Fspan>\n                <div style=\"{{ modal.carouselNote }}\">A carousel needs at least two files.<\u002Fdiv>\n                <div style=\"{{ modal.uploadStyle }}\">\n                  <label style=\"display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px dashed var(--beige-deep);border-radius:8px;font:700 9px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer\" style-hover=\"border-color:var(--maroon);color:var(--maroon)\">\n                    Upload files\n                    <input type=\"file\" multiple=\"{{ true }}\" accept=\"image/*,video/*\" sc-camel-on-change=\"{{ modal.onUpload }}\" style=\"display:none\">\n                  <\u002Flabel>\n                  <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--ink-soft)\">{{ modal.upState }}<\u002Fspan>\n                  <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--maroon)\">{{ modal.upErr }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--beige);border-radius:12px;padding:16px 18px;margin-top:12px\">\n                <span style=\"{{ modal.statusStyle }}\">{{ modal.statusLabel }}<\u002Fspan>\n                <sc-raw-select value=\"{{ modal.stage }}\" sc-camel-on-change=\"{{ modal.setStage }}\" style=\"{{ modal.stageStyle }}\">\n                  <sc-for list=\"{{ modal.stageOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n                    <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ modal.whoValue }}\" sc-camel-on-change=\"{{ modal.setWho }}\" style=\"{{ modal.whoSelectStyle }}\">\n                  <sc-for list=\"{{ modal.whoOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n                    <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <a href=\"#\" sc-camel-on-click=\"{{ modal.approve }}\" style=\"{{ modal.approveStyle }}\" style-hover=\"background:var(--ink);color:var(--ivory)\">{{ modal.approveLabel }}<\u002Fa>\n                <a href=\"#\" sc-camel-on-click=\"{{ modal.markPosted }}\" style=\"{{ modal.postedStyle }}\" style-hover=\"background:var(--ink);color:var(--ivory)\">Mark as posted<\u002Fa>\n                <p style=\"{{ modal.storyNote }}\">{{ modal.storyNoteText }}<\u002Fp>\n                <span style=\"{{ modal.readOnlyNote }}\">Sign in to approve or comment.<\u002Fspan>\n                <a href=\"#\" sc-camel-on-click=\"{{ modal.askDelete }}\" style=\"{{ modal.deleteStyle }}\" style-hover=\"color:var(--maroon)\">Delete post<\u002Fa>\n                <span style=\"{{ modal.confirmStyle }}\">\n                  <span style=\"font:400 12.5px/1.4 var(--font-sans);color:var(--ink-soft)\">Delete this post?<\u002Fspan>\n                  <a href=\"#\" sc-camel-on-click=\"{{ modal.remove }}\" style=\"padding:9px 15px;border-radius:6px;background:var(--maroon);color:var(--ivory);font:700 9px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;text-decoration:none\" style-hover=\"background:var(--ink);color:var(--ivory)\">Delete<\u002Fa>\n                  <a href=\"#\" sc-camel-on-click=\"{{ modal.cancelDelete }}\" style=\"font:700 9px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);text-decoration:none\">Keep<\u002Fa>\n                <\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"font:700 9.5px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:20px 0 10px\">Comments on this post<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ modal.comments }}\" as=\"c\">\n                  <div style=\"background:#fff;border:1px solid var(--beige);border-radius:12px;padding:13px 16px\">\n                    <div style=\"display:flex;align-items:baseline;gap:8px\">\n                      <span style=\"font:700 11px/1 var(--font-sans);color:var(--maroon)\">{{ c.who }}<\u002Fspan>\n                      <span style=\"font:400 10.5px/1 var(--font-sans);color:var(--ink-faint)\">{{ c.when }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font:400 13.5px/1.55 var(--font-sans);color:var(--ink-soft);margin-top:7px\">{{ c.text }}<\u002Fdiv>\n                    <div style=\"{{ c.sentStyle }}\">{{ c.sent }}<\u002Fdiv>\n                    <div style=\"{{ c.composer }}\">\n                      <textarea value=\"{{ c.draft }}\" sc-camel-on-change=\"{{ c.setDraft }}\" rows=\"1\" placeholder=\"Reply to this comment…\" style=\"flex:1;min-width:0;resize:vertical;padding:10px 12px;border-radius:9px;border:1px solid var(--beige);background:var(--ivory);font:400 13px/1.5 var(--font-sans);color:var(--ink);outline:none\"><\u002Ftextarea>\n                      <a href=\"#\" sc-camel-on-click=\"{{ c.submit }}\" style=\"padding:11px 14px;border-radius:6px;background:var(--ink);color:var(--ivory);font:700 9px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;white-space:nowrap;flex:none\" style-hover=\"background:var(--maroon);color:var(--ivory)\">For approval<\u002Fa>\n                    <\u002Fdiv>\n                    <div style=\"{{ c.pend }}\">\n                      <div style=\"font:400 13px/1.55 var(--font-sans);color:var(--ink-soft)\">{{ c.pendText }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:9px\">\n                        <span style=\"font:400 11px/1.4 var(--font-sans);color:var(--ink-faint);flex:1;min-width:150px\">{{ c.pendBy }}<\u002Fspan>\n                        <a href=\"#\" sc-camel-on-click=\"{{ c.approve }}\" style=\"{{ c.approveStyle }}\" style-hover=\"background:var(--maroon-deep);color:var(--ivory)\">Approve &amp; send<\u002Fa>\n                        <a href=\"#\" sc-camel-on-click=\"{{ c.discard }}\" style=\"font:700 9px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);text-decoration:none\">Discard<\u002Fa>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"{{ modal.noComments }}\">No comments pulled in yet. They appear here automatically once Instagram is connected, and replies you approve go back to the post.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"font:700 9.5px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:20px 0 10px\">Notes &amp; requested changes<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ modal.notes }}\" as=\"n\">\n                  <div style=\"background:#fff;border:1px solid var(--beige);border-radius:12px;padding:13px 16px\">\n                    <div style=\"display:flex;align-items:baseline;gap:8px\">\n                      <span style=\"font:700 11px/1 var(--font-sans);color:var(--maroon)\">{{ n.who }}<\u002Fspan>\n                      <span style=\"font:400 10.5px/1 var(--font-sans);color:var(--ink-faint)\">{{ n.when }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font:400 13.5px/1.55 var(--font-sans);color:var(--ink-soft);margin-top:7px\">{{ n.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"{{ modal.noNotes }}\">No notes yet. Ask for a change and it lands here.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"{{ modal.noteFormStyle }}\">\n                <textarea value=\"{{ modal.draft }}\" sc-camel-on-change=\"{{ modal.setDraft }}\" rows=\"2\" placeholder=\"Add a note or request a change…\" style=\"flex:1;min-width:0;resize:vertical;padding:12px 14px;border-radius:10px;border:1px solid var(--beige);background:#fff;font:400 13.5px/1.5 var(--font-sans);color:var(--ink);outline:none\"><\u002Ftextarea>\n                <input value=\"{{ modal.whoValue }}\" sc-camel-on-change=\"{{ modal.setWho }}\" placeholder=\"Your name\" style=\"{{ modal.whoStyle }}\">\n                <a href=\"#\" sc-camel-on-click=\"{{ modal.addNote }}\" style=\"padding:13px 20px;border-radius:6px;background:var(--ink);color:var(--ivory);font:700 10px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap;flex:none\" style-hover=\"background:var(--maroon);color:var(--ivory)\">Add note<\u002Fa>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 0 24px;border-top:1px solid var(--beige)\">\n                <div style=\"font:400 12px/1.5 var(--font-sans);color:var(--ink-faint);flex:1;min-width:180px\">Approved posts move to Scheduled, and the publisher picks them up from there.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLibrary }}\">\n      <div>\n        <div style=\"margin-bottom:22px\">\n          <div style=\"font:700 11px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--maroon)\">Captured on the property<\u002Fdiv>\n          <h1 style=\"font:400 34px/1.15 var(--font-serif);letter-spacing:-.02em;margin:12px 0 0\">The Content Library. <em style=\"font-style:italic;color:var(--maroon)\">Yours, and growing.<\u002Fem><\u002Fh1>\n          <div style=\"font:400 14px/1.6 var(--font-sans);color:var(--ink-faint);margin-top:10px;max-width:62ch\">Every shoot, every event, every frame — organized month by month, added to continuously, and always one link away.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--ink);border-left:4px solid var(--maroon);border-radius:14px;padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:36px;flex-wrap:wrap\">\n          <div style=\"flex:1 1 420px;min-width:0\">\n            <div style=\"font:700 9px/1.5 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--beige)\">One link, everything<\u002Fdiv>\n            <div style=\"font:400 26px/1.25 var(--font-serif);color:var(--ivory);margin-top:12px\">The full library, <em style=\"font-style:italic;color:var(--beige)\">whenever you need it.<\u002Fem><\u002Fdiv>\n            <div style=\"font:400 13.5px/1.7 var(--font-sans);color:rgba(247,242,234,.72);margin-top:12px;max-width:58ch\">All photo and video content lives here — download anything, anytime, for the website, print, email, or your own posts. If we shot it, it's in here.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:none;text-align:right\">\n            <a href=\"https://www.dropbox.com/scl/fo/sk9fg4eenmhg46ucy4vcv/AIkKu0gIiCa0KGEYHXytxa0?rlkey=l90kkeuetbh6p3i2yv20kpg8a&amp;st=f45rgbsm&amp;dl=0\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;padding:15px 26px;border-radius:999px;background:var(--beige);color:var(--ink);font:700 10px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none\" style-hover=\"background:var(--ivory);color:var(--ink)\">Open on Dropbox ↗<\u002Fa>\n            <div style=\"font:700 9px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:rgba(216,203,190,.6);margin-top:12px\">New content added after every shoot<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;align-items:start\">\n          <div style=\"background:#fff;border:1px solid var(--beige);border-top:3px solid var(--maroon);border-radius:14px;padding:24px 26px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n            <div style=\"font:700 9px/1.5 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)\">July 2026<\u002Fdiv>\n            <div style=\"font:400 21px/1.25 var(--font-serif);margin-top:10px\">The Library Begins<\u002Fdiv>\n            <div style=\"font:400 13.5px/1.6 var(--font-sans);color:var(--ink-soft);margin-top:9px\">The first captures — events and golden-hour moments across the property.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:18px\">\n              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap;font:400 13.5px/1.4 var(--font-sans)\"><span style=\"white-space:nowrap;color:var(--ink)\"><span style=\"color:var(--sage-deep)\">✓<\u002Fspan> Italian Night<\u002Fspan><span style=\"padding:4px 9px;border-radius:999px;background:var(--parchment);font:700 8px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)\">Photo<\u002Fspan><span style=\"padding:4px 9px;border-radius:999px;background:var(--parchment);font:700 8px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)\">Video<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap;font:400 13.5px/1.4 var(--font-sans)\"><span style=\"color:var(--ink)\"><span style=\"color:var(--sage-deep)\">✓<\u002Fspan> Sunrise shoot — Hickory Cabin with Sadie<\u002Fspan><span style=\"padding:4px 9px;border-radius:999px;background:var(--parchment);font:700 8px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)\">Video · Reels<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap;font:400 13.5px/1.4 var(--font-sans)\"><span style=\"white-space:nowrap;color:var(--ink)\"><span style=\"color:var(--sage-deep)\">✓<\u002Fspan> Cooking Competition<\u002Fspan><span style=\"padding:4px 9px;border-radius:999px;background:var(--parchment);font:700 8px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)\">Photo<\u002Fspan><span style=\"padding:4px 9px;border-radius:999px;background:var(--parchment);font:700 8px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)\">Video<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ libCards }}\" as=\"lc\">\n            <div style=\"{{ lc.cardStyle }}\">\n              <a href=\"#\" sc-camel-on-click=\"{{ lc.remove }}\" title=\"Remove card\" style=\"{{ lc.xStyle }}\" style-hover=\"color:var(--maroon)\">✕<\u002Fa>\n              <div style=\"font:700 9px/1.5 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)\">{{ lc.eyebrow }}<\u002Fdiv>\n              <div style=\"font:400 21px/1.25 var(--font-serif);margin-top:10px\">{{ lc.title }}<\u002Fdiv>\n              <div style=\"font:400 13.5px/1.6 var(--font-sans);color:var(--ink-soft);margin-top:9px\">{{ lc.body }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n                <a href=\"{{ lc.planUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"{{ lc.planStyle }}\" style-hover=\"background:var(--maroon);color:var(--ivory)\">View the shoot plan →<\u002Fa>\n                <a href=\"{{ lc.dropUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"{{ lc.dropStyle }}\" style-hover=\"background:var(--maroon);color:var(--ivory)\">Open on Dropbox ↗<\u002Fa>\n              <\u002Fdiv>\n              <a href=\"#\" sc-camel-on-click=\"{{ lc.startEdit }}\" style=\"{{ lc.editLinkStyle }}\" style-hover=\"color:var(--maroon)\">{{ lc.editLabel }}<\u002Fa>\n              <div style=\"{{ lc.editWrap }}\">\n                <input value=\"{{ lc.editPlan }}\" sc-camel-on-change=\"{{ lc.setEditPlan }}\" placeholder=\"Shoot plan link\" style=\"width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--beige);border-radius:6px;font:400 12.5px/1.4 var(--font-sans);color:var(--ink);background:#fff\">\n                <input value=\"{{ lc.editDrop }}\" sc-camel-on-change=\"{{ lc.setEditDrop }}\" placeholder=\"Dropbox folder link\" style=\"width:100%;box-sizing:border-box;margin-top:7px;padding:8px 10px;border:1px solid var(--beige);border-radius:6px;font:400 12.5px/1.4 var(--font-sans);color:var(--ink);background:#fff\">\n                <div style=\"display:flex;align-items:center;gap:12px;margin-top:9px\">\n                  <a href=\"#\" sc-camel-on-click=\"{{ lc.saveEdit }}\" style=\"display:inline-block;padding:8px 14px;border-radius:6px;background:var(--maroon);color:var(--ivory);font:700 8.5px/1 var(--font-sans);letter-spacing:.13em;text-transform:uppercase;text-decoration:none\" style-hover=\"background:var(--ink)\">Save links<\u002Fa>\n                  <a href=\"#\" sc-camel-on-click=\"{{ lc.cancelEdit }}\" style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);text-decoration:none\" style-hover=\"color:var(--maroon)\">Cancel<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ libForm.wrapStyle }}\">\n          <div style=\"font:700 9px/1.5 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px\">Add a month card<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px\">\n            <input value=\"{{ libForm.eyebrow }}\" sc-camel-on-change=\"{{ libForm.setEyebrow }}\" placeholder=\"Eyebrow — October 2026 · planned\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n            <input value=\"{{ libForm.title }}\" sc-camel-on-change=\"{{ libForm.setTitle }}\" placeholder=\"Card title\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n            <input value=\"{{ libForm.plan }}\" sc-camel-on-change=\"{{ libForm.setPlan }}\" placeholder=\"Shoot plan link\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n            <input value=\"{{ libForm.dropbox }}\" sc-camel-on-change=\"{{ libForm.setDropbox }}\" placeholder=\"Dropbox folder link\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n          <\u002Fdiv>\n          <textarea value=\"{{ libForm.body }}\" sc-camel-on-change=\"{{ libForm.setBody }}\" rows=\"2\" placeholder=\"A line or two on what this shoot covers.\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink);margin-top:8px;resize:vertical\"><\u002Ftextarea>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-top:10px\">\n            <a href=\"#\" sc-camel-on-click=\"{{ libForm.save }}\" style=\"display:inline-block;padding:10px 16px;border-radius:6px;background:var(--maroon);color:var(--ivory);font:700 9.5px/1 var(--font-sans);letter-spacing:.13em;text-transform:uppercase;text-decoration:none\" style-hover=\"background:var(--maroon-deep);color:var(--ivory)\">Add card<\u002Fa>\n            <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--maroon)\">{{ libForm.err }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isToolkit }}\">\n      <div>\n        <div style=\"margin-bottom:24px\">\n          <div style=\"font:700 11px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--maroon)\">Built to outlast the engagement<\u002Fdiv>\n          <h1 style=\"font:400 34px/1.1 var(--font-serif);letter-spacing:-.02em;margin:12px 0 0\">Yours to keep.<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ toolkit }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid var(--beige);border-top:3px solid var(--maroon);border-radius:14px;padding:26px 30px;box-shadow:0 2px 8px rgba(46,38,34,.07);display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start\">\n              <div>\n                <div style=\"display:flex;align-items:baseline;gap:12px\">\n                  <span style=\"font:400 16px/1 var(--font-serif);color:var(--maroon)\">{{ t.num }}<\u002Fspan>\n                  <span style=\"font:400 25px/1.15 var(--font-serif)\">{{ t.title }}<\u002Fspan>\n                  <a href=\"#\" sc-camel-on-click=\"{{ t.remove }}\" title=\"Remove\" style=\"{{ t.xStyle }}\" style-hover=\"color:var(--maroon)\">✕<\u002Fa>\n                <\u002Fdiv>\n                <div style=\"font:400 14px/1.6 var(--font-sans);color:var(--ink-soft);margin-top:10px;max-width:60ch\">{{ t.body }}<\u002Fdiv>\n                <div style=\"display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap\">\n                  <a href=\"{{ t.href }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:12px 20px;border-radius:6px;background:var(--ink);color:var(--ivory);font:700 10px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase\" style-hover=\"background:var(--maroon);color:var(--ivory)\">{{ t.cta }}<\u002Fa>\n                  <span style=\"padding:8px 13px;border-radius:999px;background:var(--parchment);font:700 9px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--sage-deep)\">{{ t.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--cream);padding-left:26px\">\n                <sc-for list=\"{{ t.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:9px;font:400 12.5px/1.5 var(--font-sans);color:var(--ink-soft)\">\n                    <span style=\"color:var(--maroon);flex:none\">✓<\u002Fspan><span>{{ i.text }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ toolkitForm.wrapStyle }}\">\n          <div style=\"font:700 9px/1.5 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px\">Add a toolkit item<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px\">\n            <input value=\"{{ toolkitForm.title }}\" sc-camel-on-change=\"{{ toolkitForm.setTitle }}\" placeholder=\"Title\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n            <input value=\"{{ toolkitForm.cta }}\" sc-camel-on-change=\"{{ toolkitForm.setCta }}\" placeholder=\"Button label — Open the files ↗\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n            <input value=\"{{ toolkitForm.href }}\" sc-camel-on-change=\"{{ toolkitForm.setHref }}\" placeholder=\"Button link\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n            <input value=\"{{ toolkitForm.status }}\" sc-camel-on-change=\"{{ toolkitForm.setStatus }}\" placeholder=\"Status pill — In use\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink)\">\n          <\u002Fdiv>\n          <textarea value=\"{{ toolkitForm.body }}\" sc-camel-on-change=\"{{ toolkitForm.setBody }}\" rows=\"2\" placeholder=\"A line or two describing it.\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink);margin-top:8px;resize:vertical\"><\u002Ftextarea>\n          <textarea value=\"{{ toolkitForm.items }}\" sc-camel-on-change=\"{{ toolkitForm.setItems }}\" rows=\"3\" placeholder=\"Checklist — one item per line\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:6px;background:#fff;font:400 13px/1.4 var(--font-sans);color:var(--ink);margin-top:8px;resize:vertical\"><\u002Ftextarea>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-top:10px\">\n            <a href=\"#\" sc-camel-on-click=\"{{ toolkitForm.save }}\" style=\"display:inline-block;padding:10px 16px;border-radius:6px;background:var(--maroon);color:var(--ivory);font:700 9.5px/1 var(--font-sans);letter-spacing:.13em;text-transform:uppercase;text-decoration:none\" style-hover=\"background:var(--maroon-deep);color:var(--ivory)\">Add item<\u002Fa>\n            <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--maroon)\">{{ toolkitForm.err }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isInbox }}\">\n      <div>\n        <div style=\"margin-bottom:22px\">\n          <div style=\"font:700 9.5px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)\">06 · Inbox<\u002Fdiv>\n          <h2 style=\"font:400 34px/1.15 var(--font-serif);color:var(--ink);margin:10px 0 8px\">Direct messages<\u002Fh2>\n          <p style=\"font:400 15px/1.6 var(--font-sans);color:var(--ink-soft);max-width:620px;margin:0\">Every DM in one place — assign it, flag the booking enquiries, and draft a reply for approval before it sends. Comments sit on the post they belong to, in the Content Calendar.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--beige);border-left:3px solid var(--gold, #A06D28);border-radius:10px;background:var(--parchment);margin-bottom:18px\">\n          <span style=\"font:700 9px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold, #A06D28)\">Sample threads<\u002Fspan>\n          <span style=\"font:400 13px/1.5 var(--font-sans);color:var(--ink-soft);flex:1;min-width:220px\">Instagram messaging switches on once The Farm's Facebook Page is connected. Replies you approve here queue until then.<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px\">\n          <sc-for list=\"{{ inbox.chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <a href=\"#\" sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\" style-hover=\"border-color:var(--maroon)\">{{ c.label }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--beige);border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(46,38,34,.07);overflow:hidden;min-height:460px\">\n          <div style=\"flex:1 1 240px;min-width:0;border-right:1px solid var(--beige);border-bottom:1px solid var(--beige);margin-right:-1px;margin-bottom:-1px;background:var(--ivory)\">\n            <div style=\ hs = ['Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];\n        const end = g.start + g.span - 1;\n        return { what: g.what,\n          span: g.span === 1 ? months[g.start] : months[g.start] + ' – ' + months[end],\n          dotStyle: 'width:8px;height:8px;flex:none;border-radius:2px;background:' + GANTT_COLOR[g.kind],\n          barStyle: 'grid-column:' + (g.start + 1) + ' / span ' + g.span + ';height:16px;border-radius:5px;background:' + GANTT_COLOR[g.kind] };\n      }),\n      cadence: CADENCE,\n      cc: this.contentCal(),\n      modal: this.ccModal(),\n\n      filters: ['All', 'Photo', 'Video', 'Reel'].map(f => ({ label: f, style: this.chipStyle(st.filter === f), go: e => { e.preventDefault(); this.setState({ filter: f }); } })),\n      libItems: filtered.map(l => ({ ...l, bg: 'position:absolute;inset:0;background-image:url(' + l.img + ');background-size:cover;background-position:center' })),\n      libCount: filtered.length + ' of ' + LIB.length + ' shown',\n\n      toolkit: TOOLKIT.map(t => ({ ...t, items: t.items.map(x => ({ text: x })), xStyle: 'display:none', remove: e => e.preventDefault() }))\n        .concat((st.remoteToolkit || []).map(r => ({\n          num: '', title: r.title, body: r.body || '',\n          cta: r.cta || 'Open ↗', href: r.href || '#', status: r.status || '',\n          items: String(r.items || '').split('\\n').filter(x => x.trim()).map(x => ({ text: x.trim() })),\n          xStyle: st.admin ? 'font:400 13px/1 var(--font-sans);color:var(--ink-faint);text-decoration:none;margin-left:auto' : 'display:none',\n          remove: e => { e.preventDefault(); this.removeRow('toolkit_items', r.id, () => this.loadToolkit()); } })))\n        .map((t, i) => ({ ...t, num: ROMAN[i] || (i + 1) + '.' })),\n      toolkitForm: (() => {\n        const d = st.kDraft, on = st.admin && this.sb;\n        const set = k => e => { const v = e.target.value; this.setState(s => ({ kDraft: { ...s.kDraft, [k]: v } })); };\n
