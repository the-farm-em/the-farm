document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"display:inline-block;padding:10px 16px;border-radius:6px;background:var(--maroon);color:var(--ivory);font:700 9.5px/1 var(--font-sans);letter-spacing:.13em;text-transform:uppercase;text-decoration:none\" style-hover=\"background:var(--maroon-deep);color:var(--ivory)\">Add entry<\u002Fa>\n            <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--ink-faint)\">Existing cards: {{ shipForm.cards }} — or type a new name.<\u002Fspan>\n            <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--maroon)\">{{ shipForm.err }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px\">\n          <sc-for list=\"{{ shipped }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid var(--beige);border-top:3px solid var(--sage);border-radius:14px;padding:20px 22px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n              <div style=\"font:400 19px/1.25 var(--font-serif)\">{{ s.title }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px\">\n                <sc-for list=\"{{ s.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:baseline;gap:9px;font:400 13px/1.5 var(--font-sans);color:var(--ink-soft)\">\n                    <span style=\"color:var(--sage-deep);flex:none\">✓<\u002Fspan><span>{{ i.text }}<\u002Fspan>\n                    <a href=\"#\" sc-camel-on-click=\"{{ i.remove }}\" title=\"Remove\" style=\"{{ i.xStyle }}\" style-hover=\"color:var(--maroon)\">✕<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMetrics }}\">\n      <div>\n        <div style=\"margin-bottom:20px\">\n          <div style=\"font:700 11px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--maroon)\">Every number in one place<\u002Fdiv>\n          <h1 style=\"font:400 34px/1.1 var(--font-serif);letter-spacing:-.02em;margin:12px 0 0\">Metrics.<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:0 0 16px\">\n          <div>\n            <div style=\"font:700 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--maroon)\">This week<\u002Fdiv>\n            <h2 style=\"font:400 26px/1.15 var(--font-serif);letter-spacing:-.015em;margin:10px 0 0\">The headline numbers.<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"font:400 12px/1.5 var(--font-sans);color:var(--ink-faint)\">{{ heroWindow }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n          <div style=\"min-width:0;flex:1 1 500px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n          <div style=\"background:var(--maroon);border-radius:14px;padding:26px 28px;grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;min-height:230px\">\n            <div>\n              <div style=\"font:700 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:rgba(247,242,234,.6)\">Daily reach<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:16px\">\n                <span style=\"font:400 66px/1 var(--font-serif);color:var(--ivory)\">{{ reachPerDay }}<\u002Fspan>\n                <span style=\"font:400 15px/1 var(--font-sans);color:rgba(247,242,234,.65)\">/day<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;background:rgba(247,242,234,.14);font:700 10px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--beige)\">{{ heroChip }}<\u002Fdiv>\n            <\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 260 44\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:44px;margin-top:16px;display:block\">\n              <polyline points=\"{{ spark }}\" fill=\"none\" stroke=\"#D8CBBE\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolyline>\n            <\u002Fsvg>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ heroMetrics }}\" as=\"m\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ m.flip }}\" style=\"{{ m.cardStyle }}\" style-hover=\"border-color:var(--beige-deep)\">\n              <div style=\"font:700 9px/1.3 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)\">{{ m.label }}<\u002Fdiv>\n              <div style=\"{{ m.faceStyle }}\">\n                <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:12px\">\n                  <span style=\"font:400 30px/1 var(--font-serif)\">{{ m.value }}<\u002Fspan>\n                  <span style=\"font:400 11px/1 var(--font-sans);color:var(--ink-faint)\">{{ m.unit }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:inline-block;margin-top:10px;padding:4px 9px;border-radius:999px;background:var(--maroon-tint);font:700 9px/1 var(--font-sans);letter-spacing:.06em;color:var(--maroon)\">{{ m.chip }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"{{ m.whyStyle }}\">{{ m.why }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:400 11px/1.5 var(--font-sans);color:var(--ink-faint);margin-top:10px;max-width:72ch;text-wrap:pretty\">Accounts reached adds up each day's reach, so someone who saw The Farm on three days counts three times. Instagram's own unique count for the week will be lower. Baseline and projections further down are targets set by hand, not live numbers.<\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--beige);padding-top:22px;margin:28px 0 16px\">\n          <div>\n            <div style=\"font:700 10px/1.5 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--maroon)\">Selected window · {{ windowStamp }}<\u002Fdiv>\n            <h2 style=\"font:400 26px/1.15 var(--font-serif);letter-spacing:-.015em;margin:10px 0 0\">Window by window.<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px;padding:4px;background:var(--cream);border-radius:999px\">\n            <sc-for list=\"{{ windows }}\" as=\"w\" hint-placeholder-count=\"3\">\n              <a href=\"#\" sc-camel-on-click=\"{{ w.go }}\" style=\"{{ w.style }}\">{{ w.label }}<\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px\">\n          <sc-for list=\"{{ windowCards }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n              <div style=\"font:700 9px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)\">{{ c.label }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:12px\">\n                <span style=\"font:400 30px/1 var(--font-serif)\">{{ c.value }}<\u002Fspan>\n                <span style=\"font:400 11px/1 var(--font-sans);color:var(--ink-faint)\">{{ c.unit }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;margin-top:11px\">\n                <span style=\"{{ c.deltaStyle }}\">{{ c.delta }}<\u002Fspan>\n                <span style=\"font:400 11px/1 var(--font-sans);color:var(--ink-faint)\">prev {{ c.prev }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:400 11px/1.5 var(--font-sans);color:var(--ink-faint);margin-top:10px\">Each card compares the selected window against the window before it. Insights from Instagram, synced hourly.<\u002Fdiv>\n\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--beige);padding-top:22px;margin:28px 0 16px\">\n          <div>\n            <div style=\"font:700 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--maroon)\">Current · in detail<\u002Fdiv>\n            <h2 style=\"font:400 26px/1.15 var(--font-serif);letter-spacing:-.015em;margin:10px 0 0\">The week in charts.<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"font:400 12px/1.5 var(--font-sans);color:var(--ink-faint)\">Daily reach, interaction mix, and the account as it looks today<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px\">\n          <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:22px 26px 14px;box-shadow:0 2px 8px rgba(46,38,34,.07);position:relative\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n              <div>\n                <div style=\"font:400 21px/1.2 var(--font-serif)\">Accounts reached per day<\u002Fdiv>\n                <div style=\"font:400 12px/1 var(--font-sans);color:var(--ink-faint);margin-top:6px\">Hover any day · dotted lines are the two pace records<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:400 12px/1 var(--font-sans);color:var(--ink-faint)\">{{ weekReach }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;margin-top:14px\">\n              <svg sc-camel-view-box=\"0 0 620 220\" style=\"width:100%;display:block;overflow:visible\">\n                <line x1=\"40\" y1=\"196\" x2=\"600\" y2=\"196\" stroke=\"#EDE3D4\" stroke-width=\"1\"><\u002Fline>\n                <line x1=\"40\" y1=\"{{ chart.yBase }}\" x2=\"600\" y2=\"{{ chart.yBase }}\" stroke=\"#C4B4A3\" stroke-width=\"1\" stroke-dasharray=\"3 4\"><\u002Fline>\n                <line x1=\"40\" y1=\"{{ chart.yPace }}\" x2=\"600\" y2=\"{{ chart.yPace }}\" stroke=\"#6F7355\" stroke-width=\"1\" stroke-dasharray=\"3 4\"><\u002Fline>\n                <text x=\"44\" y=\"{{ chart.yBaseT }}\" style=\"font:400 9px var(--font-sans);fill:#8B7F73\">25/day baseline<\u002Ftext>\n                <text x=\"44\" y=\"{{ chart.yPaceT }}\" style=\"font:400 9px var(--font-sans);fill:#565A40\">152/day best-ever pace<\u002Ftext>\n                <polygon points=\"{{ chart.area }}\" fill=\"rgba(108,30,39,.07)\"><\u002Fpolygon>\n                <polyline points=\"{{ chart.line }}\" fill=\"none\" stroke=\"#6C1E27\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpolyline>\n                <sc-for list=\"{{ chart.pts }}\" as=\"p\" hint-placeholder-count=\"7\">\n                  <g>\n                    <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"{{ p.r }}\" fill=\"{{ p.fill }}\" stroke=\"#6C1E27\" stroke-width=\"2\"><\u002Fcircle>\n                    <circle cx=\"{{ p.x }}\" cy=\"110\" r=\"26\" fill=\"transparent\" sc-camel-on-mouse-enter=\"{{ p.enter }}\" sc-camel-on-mouse-leave=\"{{ p.leave }}\" style=\"cursor:pointer\"><\u002Fcircle>\n                  <\u002Fg>\n                <\u002Fsc-for>\n                {{ chart.labels }}\n              <\u002Fsvg>\n              <div style=\"{{ tip.style }}\">\n                <div style=\"font:400 20px/1 var(--font-serif)\">{{ tip.value }}<\u002Fdiv>\n                <div style=\"font:700 8px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:rgba(247,242,234,.6);margin-top:5px\">{{ tip.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:22px 24px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n            <div style=\"font:400 21px/1.2 var(--font-serif)\">{{ weekInteractions }}<\u002Fdiv>\n            <div style=\"font:400 12px/1 var(--font-sans);color:var(--ink-faint);margin-top:6px\">{{ weekInteractionsLift }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:20px;margin-top:18px\">\n              <svg sc-camel-view-box=\"0 0 120 120\" style=\"width:118px;height:118px;flex:none\">\n                <sc-for list=\"{{ donut }}\" as=\"d\" hint-placeholder-count=\"4\">\n                  <circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"{{ d.color }}\" stroke-width=\"{{ d.w }}\" stroke-dasharray=\"{{ d.dash }}\" stroke-dashoffset=\"{{ d.offset }}\" transform=\"rotate(-90 60 60)\" sc-camel-on-mouse-enter=\"{{ d.enter }}\" sc-camel-on-mouse-leave=\"{{ d.leave }}\" style=\"cursor:pointer;transition:stroke-width .15s\"><\u002Fcircle>\n                <\u002Fsc-for>\n                {{ donutLabels }}\n              <\u002Fsvg>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ donut }}\" as=\"d\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-mouse-enter=\"{{ d.enter }}\" sc-camel-on-mouse-leave=\"{{ d.leave }}\" style=\"{{ d.rowStyle }}\">\n                    <span style=\"{{ d.swatchStyle }}\"><\u002Fspan>\n                    <span style=\"font:400 13px/1.3 var(--font-sans)\"><strong style=\"font-weight:700\">{{ d.value }}<\u002Fstrong> {{ d.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--beige);padding-top:22px;margin:28px 0 16px\">\n          <div>\n            <div style=\"font:700 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--maroon)\">Previous<\u002Fdiv>\n            <h2 style=\"font:400 26px/1.15 var(--font-serif);letter-spacing:-.015em;margin:10px 0 0\">Where we've been.<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px;padding:4px;background:var(--cream);border-radius:999px\">\n            <sc-for list=\"{{ months }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <a href=\"#\" sc-camel-on-click=\"{{ m.go }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px\">\n          <sc-for list=\"{{ baseline }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n              <div style=\"font:700 9px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)\">{{ b.label }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:12px\">\n                <span style=\"font:400 32px/1 var(--font-serif)\">{{ b.value }}<\u002Fspan>\n                <span style=\"font:400 11px/1 var(--font-sans);color:var(--ink-faint)\">{{ b.unit }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:var(--maroon-tint);font:700 9px/1 var(--font-sans);letter-spacing:.06em;color:var(--maroon)\">{{ b.chip }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:20px 24px;box-shadow:0 2px 8px rgba(46,38,34,.07);border-left:3px solid var(--maroon);margin-bottom:22px\">\n          <div style=\"font:400 15px/1.6 var(--font-sans);color:var(--ink)\">{{ monthNote }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--beige);padding-top:22px;margin:28px 0 16px\">\n          <div>\n            <div style=\"font:700 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--maroon)\">Future projections · updated by hand<\u002Fdiv>\n            <h2 style=\"font:400 26px/1.15 var(--font-serif);letter-spacing:-.015em;margin:10px 0 0\">Where we're going.<\u002Fh2>\n            <div style=\"font:400 13px/1.6 var(--font-sans);color:var(--ink-soft);margin-top:9px;max-width:58ch\">Targets, not forecasts. Every number below is set by hand, so we can be as ambitious as we want.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px;padding:4px;background:var(--cream);border-radius:999px\">\n            <sc-for list=\"{{ horizons }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <a href=\"#\" sc-camel-on-click=\"{{ h.go }}\" style=\"{{ h.style }}\">{{ h.label }}<\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--parchment);border:1px solid var(--beige);border-radius:14px;padding:20px 24px;margin-bottom:14px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n            <div style=\"font:400 19px/1.2 var(--font-serif)\">The ambition board<\u002Fdiv>\n            <span style=\"font:700 9px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)\">{{ projNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px\">\n            <sc-for list=\"{{ projections }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff;border:1px solid var(--beige);border-radius:12px;padding:16px 18px\">\n                <div style=\"font:700 9px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)\">{{ p.label }}<\u002Fdiv>\n                <input value=\"{{ p.value }}\" sc-camel-on-change=\"{{ p.set }}\" sc-camel-read-only=\"{{ p.locked }}\" style=\"{{ p.inputStyle }}\">\n                <div style=\"font:400 12px/1.5 var(--font-sans);color:var(--ink-soft);margin-top:4px\">{{ p.by }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;margin-bottom:14px\">\n          <div style=\"flex:1 1 460px;min-width:0;background:#fff;border:1px solid var(--beige);border-top:3px solid var(--maroon);border-radius:14px;padding:22px 26px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n            <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n              <span style=\"font:400 25px/1 var(--font-serif)\">{{ horizon.title }}<\u002Fspan>\n              <span style=\"font:700 9.5px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)\">{{ horizon.when }}<\u002Fspan>\n              <span style=\"font:400 16px/1 var(--font-script);color:var(--gold-deep);margin-left:auto\">{{ horizon.question }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:20px\">\n              <sc-for list=\"{{ goalBars }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;align-items:baseline;gap:10px\">\n                    <span style=\"font:400 15px/1.3 var(--font-serif);flex:1;min-width:0\">{{ g.t }}<\u002Fspan>\n                    <span style=\"font:700 9.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)\">{{ g.readout }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:8px;border-radius:999px;background:var(--cream);margin-top:9px;overflow:hidden\">\n                    <div style=\"{{ g.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font:400 12px/1.5 var(--font-sans);color:var(--ink-soft);margin-top:7px\">{{ g.d }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:0 1 340px;min-width:280px;background:#fff;border:1px solid var(--beige);border-radius:14px;padding:22px 24px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n            <div style=\"font:700 10px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--sage-deep)\">In motion now<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px\">\n              <sc-for list=\"{{ motionBars }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"display:flex;align-items:baseline;gap:8px\">\n                    <span style=\"font:400 12.5px/1.4 var(--font-sans);color:var(--ink);flex:1;min-width:0\">{{ m.label }}<\u002Fspan>\n                    <span style=\"font:700 9px/1 var(--font-sans);color:var(--ink-faint)\">{{ m.pct }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;border-radius:999px;background:var(--cream);margin-top:7px;overflow:hidden\">\n                    <div style=\"{{ m.barStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:22px 26px 18px;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n            <div style=\"font:400 21px/1.2 var(--font-serif)\">The next twelve months<\u002Fdiv>\n            <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n              <sc-for list=\"{{ ganttLegend }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:6px\">\n                  <span style=\"{{ l.dot }}\"><\u002Fspan>\n                  <span style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)\">{{ l.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;margin-top:16px;border-bottom:1px solid var(--cream);padding-bottom:7px\">\n            <span><\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr))\">\n              <sc-for list=\"{{ ganttMonths }}\" as=\"m\" hint-placeholder-count=\"12\">\n                <div style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);text-align:center\">{{ m }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:10px\">\n            <sc-for list=\"{{ ganttRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div style=\"display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:center\">\n                <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                  <span style=\"{{ r.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font:400 12.5px/1.35 var(--font-sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.what }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:center;height:26px\">\n                  <div style=\"{{ r.barStyle }}\" title=\"{{ r.span }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px\">\n          <sc-for list=\"{{ cadence }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"background:var(--parchment);border-radius:14px;padding:18px 20px\">\n              <div style=\"font:700 9px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--maroon)\">{{ c.every }}<\u002Fdiv>\n              <div style=\"font:400 17px/1.25 var(--font-serif);margin-top:9px\">{{ c.title }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:24px 28px 16px;box-shadow:0 2px 8px rgba(46,38,34,.07);margin-top:14px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n            <div style=\"font:400 21px/1.2 var(--font-serif)\">Daily reach — the trajectory<\u002Fdiv>\n            <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n              <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:16px;height:3px;background:var(--maroon)\"><\u002Fspan><span style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)\">Actual<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:16px;height:3px;background:var(--sage)\"><\u002Fspan><span style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)\">30-day projection<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:16px;height:3px;background:var(--maroon);opacity:.5\"><\u002Fspan><span style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)\">Target<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;margin-top:16px\">\n            <svg sc-camel-view-box=\"0 0 900 300\" style=\"width:100%;display:block;overflow:visible\">\n              <sc-for list=\"{{ traj.gridlines }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <line x1=\"52\" y1=\"{{ g.y }}\" x2=\"880\" y2=\"{{ g.y }}\" stroke=\"#EDE3D4\" stroke-width=\"1\"><\u002Fline>\n              <\u002Fsc-for>\n              <line x1=\"{{ traj.todayX }}\" y1=\"20\" x2=\"{{ traj.todayX }}\" y2=\"252\" stroke=\"#C4B4A3\" stroke-width=\"1\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <text x=\"{{ traj.todayX }}\" y=\"16\" text-anchor=\"middle\" style=\"font:700 9px var(--font-sans);letter-spacing:.1em;fill:#8B7F73\">TODAY<\u002Ftext>\n              <polygon points=\"{{ traj.area }}\" fill=\"rgba(108,30,39,.08)\"><\u002Fpolygon>\n              <polyline points=\"{{ traj.actual }}\" fill=\"none\" stroke=\"#6C1E27\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpolyline>\n              <polyline points=\"{{ traj.target }}\" fill=\"none\" stroke=\"#6C1E27\" stroke-width=\"2.5\" stroke-dasharray=\"7 6\" stroke-linejoin=\"round\" opacity=\".55\"><\u002Fpolyline>\n              <polygon points=\"{{ traj.band }}\" fill=\"rgba(111,115,85,.18)\"><\u002Fpolygon>\n              <polyline points=\"{{ traj.projection }}\" fill=\"none\" stroke=\"#6F7355\" stroke-width=\"3\" stroke-dasharray=\"2 5\" stroke-linecap=\"round\"><\u002Fpolyline>\n              <sc-for list=\"{{ traj.pts }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"{{ p.r }}\" fill=\"{{ p.fill }}\" stroke=\"{{ p.stroke }}\" stroke-width=\"{{ p.sw }}\" sc-camel-on-click=\"{{ p.go }}\" style=\"cursor:pointer\"><\u002Fcircle>\n              <\u002Fsc-for>\n              {{ traj.labels }}\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCalendar }}\">\n      <div>\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:20px\">\n          <div style=\"max-width:52ch\">\n            <div style=\"font:700 11px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--maroon)\">Social / The Farm<\u002Fdiv>\n            <h1 style=\"font:400 40px/1.05 var(--font-serif);letter-spacing:-.02em;margin:14px 0 0\">Content calendar<\u002Fh1>\n            <div style=\"font:400 15px/1.6 var(--font-sans);color:var(--ink-soft);margin-top:12px\">Plan, approve, and queue every post here. Open a card for the caption and the approval thread.<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px\">\n              <span style=\"{{ cc.connStyle }}\">● {{ cc.connLabel }}<\u002Fspan>\n              <span style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)\">{{ cc.role }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:stretch\">\n            <a href=\"#\" sc-camel-on-click=\"{{ cc.composer.toggle }}\" style=\"{{ cc.composer.toggleStyle }}\" style-hover=\"background:var(--maroon-deep);color:var(--ivory)\">{{ cc.composer.toggleLabel }}<\u002Fa>\n            <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:18px 26px;text-align:center;box-shadow:0 2px 8px rgba(46,38,34,.07);min-width:112px\">\n              <div style=\"font:400 30px/1 var(--font-serif)\">{{ cc.planned }}<\u002Fdiv>\n              <div style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:8px\">This month<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;padding:18px 26px;text-align:center;box-shadow:0 2px 8px rgba(46,38,34,.07);min-width:112px\">\n              <div style=\"font:400 30px/1 var(--font-serif);color:var(--gold-deep)\">{{ cc.needApproval }}<\u002Fdiv>\n              <div style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:8px\">Need approval<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ cc.composer.wrapStyle }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px\">\n            <input type=\"date\" value=\"{{ cc.composer.date }}\" sc-camel-on-change=\"{{ cc.composer.setDate }}\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:7px;background:#fff;font:400 13px/1.3 var(--font-sans);color:var(--ink);outline:none\">\n            <input type=\"time\" value=\"{{ cc.composer.time }}\" sc-camel-on-change=\"{{ cc.composer.setTime }}\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:7px;background:#fff;font:400 13px/1.3 var(--font-sans);color:var(--ink);outline:none\">\n            <sc-raw-select value=\"{{ cc.composer.type }}\" sc-camel-on-change=\"{{ cc.composer.setType }}\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:7px;background:#fff;font:400 13px/1.3 var(--font-sans);color:var(--ink);outline:none\">\n              <sc-for list=\"{{ cc.composer.types }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <input value=\"{{ cc.composer.title }}\" sc-camel-on-change=\"{{ cc.composer.setTitle }}\" placeholder=\"Working title\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:7px;background:#fff;font:400 13px/1.3 var(--font-sans);color:var(--ink);outline:none\">\n            <input value=\"{{ cc.composer.img }}\" sc-camel-on-change=\"{{ cc.composer.setImg }}\" placeholder=\"Or paste an asset link\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:7px;background:#fff;font:400 13px/1.3 var(--font-sans);color:var(--ink);outline:none\">\n          <\u002Fdiv>\n          <textarea value=\"{{ cc.composer.caption }}\" sc-camel-on-change=\"{{ cc.composer.setCaption }}\" placeholder=\"Caption — write it the way it will post.\" style=\"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--beige);border-radius:7px;background:#fff;font:400 13px/1.3 var(--font-sans);color:var(--ink);outline:none;margin-top:8px;min-height:96px;resize:vertical;line-height:1.6\"><\u002Ftextarea>\n\n          <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px\">\n            <label style=\"display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border:1px dashed var(--beige-deep);border-radius:8px;background:#fff;font:700 9.5px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer\" style-hover=\"border-color:var(--maroon);color:var(--maroon)\">\n              Upload files\n              <input type=\"file\" multiple=\"{{ true }}\" accept=\"image/*,video/*\" sc-camel-on-change=\"{{ cc.composer.onUpload }}\" style=\"display:none\">\n            <\u002Flabel>\n            <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--ink-faint)\">Images and video. Several at once for a carousel.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"{{ cc.composer.stagedStyle }}\">\n            <sc-for list=\"{{ cc.composer.staged }}\" as=\"a\">\n              <span style=\"display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--beige);border-radius:999px;background:#fff\">\n                <span style=\"{{ a.thumb }}\"><\u002Fspan>\n                <span style=\"font:400 11px/1 var(--font-sans);color:var(--ink-soft);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.label }}<\u002Fspan>\n                <a href=\"#\" sc-camel-on-click=\"{{ a.remove }}\" style=\"font:400 14px/1 var(--font-sans);color:var(--ink-faint);text-decoration:none\">×<\u002Fa>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"{{ cc.composer.orderNote }}\">Carousel slides post in the order shown.<\u002Fdiv>\n          <div style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--ink-soft);margin-top:8px\">{{ cc.composer.upState }}<\u002Fdiv>\n          <div style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--maroon);margin-top:4px\">{{ cc.composer.upErr }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-top:10px\">\n            <a href=\"#\" sc-camel-on-click=\"{{ cc.composer.save }}\" style=\"display:inline-block;padding:12px 20px;border-radius:6px;background:var(--maroon);color:var(--ivory);font:700 9.5px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap;flex:none\" style-hover=\"background:var(--ink);color:var(--ivory)\">Add to calendar<\u002Fa>\n            <span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--ink-faint)\">Lands as For approval — it shows up in Kristie's queue right away.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--beige);margin-bottom:16px\">\n          <sc-for list=\"{{ cc.types }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <a href=\"#\" sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fa>\n          <\u002Fsc-for>\n          <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-left:auto\">\n            <sc-for list=\"{{ cc.typeLegend }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:6px\">\n                <span style=\"{{ l.dot }}\"><\u002Fspan>\n                <span style=\"font:700 8.5px/1 var(--font-sans);letter-spacing:.12em;color:var(--ink-faint)\">{{ l.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid var(--beige);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(46,38,34,.07)\">\n          <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 26px 16px\">\n            <a href=\"#\" sc-camel-on-click=\"{{ cc.prev }}\" style=\"width:30px;height:30px;flex:none;border:1px solid var(--beige);border-radius:999px;display:flex;align-items:center;justify-content:center;font:400 13px/1 var(--font-sans);color:var(--ink);text-decoration:none\" style-hover=\"border-color:var(--maroon);color:var(--maroon)\">‹<\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ cc.next }}\" style=\"width:30px;height:30px;flex:none;border:1px solid var(--beige);border-radius:999px;display:flex;align-items:center;justify-content:center;font:400 13px/1 var(--font-sans);color:var(--ink);text-decoration:none\" style-hover=\"border-color:var(--maroon);color:var(--maroon)\">›<\u002Fa>\n            <span style=\"font:400 27px/1 var(--font-serif)\">{{ cc.monthTitle }}<\u002Fspan>\n            <a href=\"#\" sc-camel-on-click=\"{{ cc.thisMonth }}\" style=\"{{ cc.thisMonthStyle }}\">Back to this month<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--maroon)\">\n            <sc-for list=\"{{ cc.dows }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <div style=\"font:700 9px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ivory);padding:13px 10px\">{{ d }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ cc.weeks }}\" as=\"w\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr))\">\n              <sc-for list=\"{{ w.cells }}\" as=\"c\" hint-placeholder-count=\"7\">\n                <div sc-camel-on-drag-over=\"{{ c.over }}\" sc-camel-on-drop=\"{{ c.drop }}\" style=\"{{ c.cellStyle }}\">\n                  <div style=\"{{ c.dayStyle }}\">{{ c.dayLabel }}<\u002Fdiv>\n                  <a href=\"#\" sc-camel-on-click=\"{{ c.open }}\" draggable=\"{{ c.draggable }}\" sc-camel-on-drag-start=\"{{ c.dragStart }}\" sc-camel-on-drag-end=\"{{ c.dragEnd }}\" title=\"{{ c.tip }}\" style=\"{{ c.cardStyle }}\" style-hover=\"border-color:var(--maroon)\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 8px 5px\">\n                      <span style=\"{{ c.typeStyle }}\">{{ c.type }}<\u002Fspan>\n                      <span style=\"{{ c.statusDot }}\"><\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"{{ c.img }}\"><\u002Fdiv>\n                    <video src=\"{{ c.vidSrc }}\" style=\"{{ c.vid }}\" muted=\"muted\" sc-camel-plays-inline=\"playsInline\" preload=\"metadata\"><\u002Fvideo>\n                    <div style=\"padding:8px 8px 9px\">\n                      <div style=\"font:400 12px/1.3 var(--font-serif);color:var(--maroon)\">{{ c.title }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px\">\n                        <span style=\"font:700 7.5px/1 var(--font-sans)
